name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      # Production runs Postgres 17 on Neon; SQLite cannot check migrations, partial
      # indexes, JSONB or locking, so the suite runs on both.
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: health_tests
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-dev.lock
      - run: ruff check .
      - name: Tests on SQLite
        run: pytest
        env:
          DATABASE_URL: sqlite://
          GEMINI_API_KEY: test-key-not-used
      - name: Tests on Postgres 17
        run: pytest
        env:
          DATABASE_URL: sqlite://
          TEST_DATABASE_URL: postgresql://postgres:test@localhost:5432/health_tests
          GEMINI_API_KEY: test-key-not-used
      - name: Import the app the container runs
        run: python -c "import main"
        env:
          DATABASE_URL: sqlite://

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t health-app-backend .
      - name: Cold import time inside the image
        run: |
          docker run --rm -e DATABASE_URL=sqlite:// -e GEMINI_API_KEY=ci health-app-backend \
            python -X importtime -c "import main" 2>&1 | tail -1 | awk -F'|' '{printf "import main: %.0f ms\n", $2/1000}'
