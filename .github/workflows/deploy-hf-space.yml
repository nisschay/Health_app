name: Deploy backend to Hugging Face Space

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-hf-space
  cancel-in-progress: true

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Push a snapshot of main to the Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: |
          test -n "$HF_TOKEN" -a -n "$HF_SPACE" || { echo "Set the HF_TOKEN secret and HF_SPACE variable (user/space)"; exit 1; }
          git config user.name github-actions
          git config user.email github-actions@github.com
          git checkout -q --orphan deploy
          git ls-files -z -ci --exclude-from=.dockerignore | grep -zv '^README.md$' | xargs -0 -r git rm -q --cached
          git commit -q -m "Deploy ${GITHUB_SHA}"
          git push --force "https://oauth2:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}" deploy:main
