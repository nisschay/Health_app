[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py311"
line-length = 120
exclude = [".venv", "web", "archive", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
    "E501",   # long lines are reported by the formatter, not the linter
    "B008",   # FastAPI Depends() in defaults is the framework's own idiom
]

[tool.ruff.lint.per-file-ignores]
# The legacy Streamlit modules are scheduled for extraction; lint them for real
# errors only until then.
"Helper_Functions.py" = ["E", "W", "I", "UP", "B"]
"Medical_Project.py" = ["E", "W", "I", "UP", "B", "F405", "F403"]
